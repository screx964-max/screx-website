<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>施工事例管理｜S.C.REX</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif;padding:20px}main{max-width:780px;margin:20px auto}h1,h2{color:#D8C6A0}h1{font-size:25px}a{color:#D8C6A0}section,.item{background:#151515;border:1px solid #74603d;border-radius:8px;padding:20px;margin:20px 0}label{display:block;color:#D8C6A0;margin:14px 0 6px}input:not([type=checkbox]),textarea{width:100%;padding:13px;background:#222;border:1px solid #777;border-radius:5px;color:#fff;font:inherit}textarea{min-height:115px}button{background:#D8C6A0;color:#111;border:0;padding:12px 17px;border-radius:5px;cursor:pointer;font-weight:bold;margin:8px 8px 8px 0}button.secondary{background:#444;color:white}button.danger{background:#a94d4d;color:white}button:disabled{opacity:.5;cursor:wait}.item img{max-width:100%;max-height:230px;object-fit:contain;display:block;margin:10px 0}.item p{white-space:pre-wrap;overflow-wrap:anywhere}#status{white-space:pre-wrap;color:#e8d39f;min-height:1.5em}#editor,#dashboard{display:none}.inline{display:flex;gap:12px;align-items:center}.inline label{margin:0}small{color:#bbb}</style></head><body><main><p><a href="./index.html">← ホームページに戻る</a></p><h1>S.C.REX 施工事例管理</h1><p id="status" role="status"></p><section id="login"><h2>管理者ログイン</h2><form id="login-form"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">ログイン</button></form></section><div id="dashboard"><button id="logout" class="secondary">ログアウト</button><section id="editor"><h2 id="form-heading">施工事例を追加</h2><form id="project-form"><input id="project-id" type="hidden"><label for="title">タイトル</label><input id="title" type="text" maxlength="150" required placeholder="例：福岡市 カーポート施工"><label for="description">施工内容・説明</label><textarea id="description" placeholder="工事の内容など"></textarea><label for="photo">施工写真（JPEG・PNG・WebP、10MB以下）</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><small>編集時に写真を選ばなければ、今の写真をそのまま使います。</small><p class="inline"><input id="published" type="checkbox"><label for="published">ホームページに公開する</label></p><button id="save" type="submit">保存する</button><button id="cancel" type="button" class="secondary">入力をクリア</button></form></section><section><h2>登録済みの施工事例</h2><div id="items"></div></section></div></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://hvgnsywugtoefswwjrma.supabase.co','sb_publishable_k0K2oDmRuUV4PzFVCVitWQ_peB73Wvg');const el=id=>document.getElementById(id);let records=[];let busy=false;
const say=s=>{el('status').textContent=s};const show=id=>el(id).style.display='block';const hide=id=>el(id).style.display='none';
function reset(){el('project-form').reset();el('project-id').value='';el('form-heading').textContent='施工事例を追加';}
async function refresh(){const{data,error}=await db.from('projects').select('id,title,description,image_url,published,created_at').order('created_at',{ascending:false});if(error)throw error;records=data||[];el('items').replaceChildren();if(!records.length)el('items').textContent='まだ施工事例はありません。';for(const item of records){const box=document.createElement('div');box.className='item';const heading=document.createElement('h3');heading.textContent=item.title;const state=document.createElement('small');state.textContent=item.published?'公開中':'非公開';box.append(heading,state);if(item.image_url){const img=document.createElement('img');img.src=item.image_url;img.alt=item.title;img.loading='lazy';box.append(img)}const description=document.createElement('p');description.textContent=item.description||'';box.append(description);const edit=document.createElement('button');edit.textContent='編集';edit.onclick=()=>{el('project-id').value=item.id;el('title').value=item.title;el('description').value=item.description||'';el('published').checked=item.published;el('photo').value='';el('form-heading').textContent='施工事例を編集';el('editor').scrollIntoView({behavior:'smooth'});say('編集内容を入力して「保存する」を押してね。')};const del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=()=>remove(item);box.append(edit,del);el('items').append(box)}}
async function verify(){const{data:{user}}=await db.auth.getUser();if(!user){show('login');hide('dashboard');return}const{data,error}=await db.rpc('is_site_admin');if(error||data!==true){await db.auth.signOut();show('login');hide('dashboard');say('管理者権限がありません。管理者ユーザーでログインしてください。');return}hide('login');show('dashboard');show('editor');await refresh()}
el('login-form').onsubmit=async e=>{e.preventDefault();say('ログイン中…');const{error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});el('password').value='';if(error){say('ログインできませんでした。メールアドレスとパスワードを確認してください。');return}try{await verify();if(el('dashboard').style.display==='block')say('ログインしました。')}catch(err){say('読み込みエラー：'+err.message)}};
el('logout').onclick=async()=>{await db.auth.signOut();reset();hide('dashboard');show('login');say('ログアウトしました。')};el('cancel').onclick=()=>{reset();say('入力をクリアしました。')};
function storagePath(imageUrl){if(!imageUrl)return null;const prefix='https://hvgnsywugtoefswwjrma.supabase.co/storage/v1/object/public/project-images/';return imageUrl.startsWith(prefix)?decodeURIComponent(imageUrl.slice(prefix.length).split('?')[0]):null}
async function remove(item){if(busy)return;if(!confirm('「'+item.title+'」を削除しますか？ この操作は取り消せません。'))return;busy=true;say('削除中…');try{const{error}=await db.from('projects').delete().eq('id',item.id);if(error)throw error;const path=storagePath(item.image_url);if(path){const{error:storageError}=await db.storage.from('project-images').remove([path]);if(storageError)console.warn('写真の削除に失敗:',storageError)}await refresh();say('削除しました。')}catch(err){say('削除できませんでした：'+err.message)}finally{busy=false}}
el('project-form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;el('save').disabled=true;say('保存中…');let uploadedPath=null;try{const id=el('project-id').value;const old=records.find(x=>String(x.id)===id);const file=el('photo').files[0];let imageUrl=old?.image_url||null;if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPEG・PNG・WebPの写真を選んでください。');if(file.size>10*1024*1024)throw Error('写真は10MB以下にしてください。');const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];uploadedPath=crypto.randomUUID()+'.'+ext;const{error:uploadError}=await db.storage.from('project-images').upload(uploadedPath,file,{contentType:file.type,upsert:false});if(uploadError)throw uploadError;imageUrl=db.storage.from('project-images').getPublicUrl(uploadedPath).data.publicUrl}const payload={title:el('title').value.trim(),description:el('description').value.trim(),image_url:imageUrl,published:el('published').checked};if(!payload.title)throw Error('タイトルを入力してください。');const result=id?await db.from('projects').update(payload).eq('id',id):await db.from('projects').insert(payload);if(result.error)throw result.error;if(old&&uploadedPath){const oldPath=storagePath(old.image_url);if(oldPath)await db.storage.from('project-images').remove([oldPath])}reset();await refresh();say('保存しました！ 公開にチェックした施工事例はホームページに表示されます。')}catch(err){if(uploadedPath){await db.storage.from('project-images').remove([uploadedPath])}say('保存できませんでした：'+err.message)}finally{busy=false;el('save').disabled=false}};
try{await verify()}catch(err){say('接続エラー：'+err.message)}
</script></body></html>
